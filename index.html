<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <title>Movie Gallery</title>
  </head>
  <body>
    <header>
      <h2 class="logo">Movie Gallery</h2>
    </header>
    <section class="query-section"></section>
    <main class="main none">
      <section class="detailedFrame">
        <figure class="detailedContainer">
          <img src="" alt="" class="detailedContainer_image animation-left" />
          <figcaption class="detailedContainer_title animation-right"></figcaption>
          <button id="hidingButton" aria-label="Close detailed view">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
              <path
                d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"
              />
            </svg>
          </button>
        </figure>
      </section>
      <button id="queryButton">Back to Query</button>
      <ul class="gallery"></ul>
      <div class="navigation">
        <button id="prevButton" disabled>Previous</button>
        <button id="nextButton" disabled>Next</button>
      </div>
    </main>
    <script src="src/main.js" type="module"></script>
  </body>
</html>
